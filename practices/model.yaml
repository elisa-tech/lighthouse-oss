relations:

- id: satisfies
  display_name: Satisfies
  inverse: is_satisfied_by
  direction: upstream
  primary: true
- id: is_satisfied_by
  display_name: Is satisfied by
  inverse: satisfies
  direction: downstream
  primary: false
- id: depends_on
  display_name: Depends on
  inverse: is_required_by
  direction: peer
  primary: true
- id: is_required_by
  display_name: Is required by
  inverse: depends_on
  direction: peer
  primary: false
