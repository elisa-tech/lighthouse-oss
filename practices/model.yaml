# Lighthouse OSS practice model for sara.
#
# Each practice area has two item types:
#   - <area>              the category (root), e.g. GOV-000
#   - <area>_requirement  a practice that satisfies the category, e.g. GOV-001
#
# Shared definitions are YAML anchors (&name) reused below via aliases (*name).

item_types:

# --- Governance --------------------------------------------------------------

- id: governance
  display_name: Governance
  prefix: GOV
  id_format: &id_format "{prefix}-{seq:03}"
  fields: &category_fields
  - name: assessment_question
    display_name: Assessment Question
    field_type: text

- id: governance_requirement
  display_name: Governance Requirement
  prefix: GOV
  id_format: *id_format
  parent_types: [governance]
  fields: &requirement_fields
  - name: rationale
    display_name: Rationale
    field_type: text
    required: true
  - name: status
    display_name: Status
    field_type: !enum
      values: [Draft, Approved, Implemented]
    required: true
    placeholder: Draft
  - name: review_status
    display_name: Review Status
    field_type: !enum
      values: [Not Reviewed, Reviewed, Rejected]
    required: true
    placeholder: Not Reviewed
  - name: source
    display_name: Source
    field_type: text
  - name: tags
    display_name: Tags
    field_type: !list text
  - name: version
    display_name: Version
    field_type: text
  - name: last_modified
    display_name: Last Modified
    field_type: date
  allowed_targets:
  - relation: satisfies
    targets: [governance]
  - relation: depends_on
    targets: &requirement_types
    - governance_requirement
    - community_health_requirement
    - development_practices_requirement
    - security_requirement
    - supply_chain_requirement
    - quality_engineering_requirement
    - documentation_requirement
    - sustainability_requirement

